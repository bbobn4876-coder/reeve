<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#06060a" />
<meta name="robots" content="noindex,follow" />
<title>404 · Page not found — Reeve Agency</title>
<meta name="description" content="This page does not exist on reeve.agency. Head back to the home page to find our services, sectors, process and contact." />
<link rel="canonical" href="https://reeve.agency/" />
<link rel="icon" type="image/svg+xml" href="/logo/logo.svg" />
<link rel="apple-touch-icon" href="/logo/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #06060a;
    --muted: #a4a4b8;
    --grad: linear-gradient(135deg, #7c5cff 0%, #a855f7 100%);
    --grad-text: linear-gradient(90deg, #7c5cff 0%, #b689ff 50%, #a855f7 100%);
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(700px 500px at 30% 20%, rgba(124,92,255,0.15), transparent 70%),
      radial-gradient(600px 500px at 80% 80%, rgba(168,85,247,0.10), transparent 70%);
  }
  main { max-width: 640px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(72px, 14vw, 160px);
    line-height: 1;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: var(--grad-text);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  h2 {
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 600;
    margin: 20px 0 12px;
    letter-spacing: -0.01em;
  }
  p { color: var(--muted); font-size: 16px; margin: 0 0 32px; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    background: var(--grad);
    color: #fff;
    font-weight: 500; font-size: 15px;
    text-decoration: none;
    box-shadow: 0 10px 30px -8px rgba(124,92,255,0.55);
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">// 404</div>
  <h1>404</h1>
  <h2>This page does not exist</h2>
  <p>The link may be old or the page has moved. Head back home to find our services, sectors, process and how to start a campaign with us.</p>
  <a class="btn" href="/">← Back to Reeve Agency</a>
</main>
</body>
</html>
